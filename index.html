<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Website Builder - Create Sites Instantly</title>
<style>
:root {
--primary: #6366f1;
--primary-dark: #4f46e5;
--bg: #0f172a;
--text: #f8fafc;
--card-bg: #1e293b;
}

{
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
background-color: var(--bg);
color: var(--text);
line-height: 1.6;
}

/ Header /
header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 1.5rem 5%;
background: rgba(15, 23, 42, 0.9);
position: sticky;
top: 0;
backdrop-filter: blur(10px);
z-index: 100;
border-bottom: 1px solid #334155;
}

.logo {
font-size: 1.5rem;
font-weight: bold;
color: var(--primary);
display: flex;
align-items: center;
gap: 0.5rem;
}

nav a {
color: var(--text);
text-decoration: none;
margin-left: 2rem;
font-weight: 500;
transition: color 0.3s;
}

nav a:hover {
color: var(--primary);
}

.btn {
background-color: var(--primary);
color: white;
padding: 0.75rem 1.5rem;
border-radius: 0.5rem;
text-decoration: none;
font-weight: bold;
transition: transform 0.2s, background-color 0.2s;
border: none;
cursor: pointer;
}

.btn:hover {
background-color: var(--primary-dark);
transform: translateY(-2px);
}

/ Hero Section /
.hero {
text-align: center;
padding: 6rem 5% 4rem;
max-width: 1200px;
margin: 0 auto;
}

.hero h1 {
font-size: 3.5rem;
margin-bottom: 1.5rem;
background: linear-gradient(to right, #818cf8, #c084fc);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

.hero p {
font-size: 1.25rem;
color: #94a3b8;
max-width: 700px;
margin: 0 auto 2.5rem;
}

/ Input Area /
.generator-box {
background: var(--card-bg);
padding: 2rem;
border-radius: 1rem;
max-width: 800px;
margin: 0 auto;
border: 1px solid #334155;
box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
}

.input-group {
display: flex;
gap: 1rem;
margin-bottom: 1rem;
}

input[type="text"] {
flex: 1;
padding: 1rem;
border-radius: 0.5rem;
border: 1px solid #475569;
background: #0f172a;
color: white;
font-size: 1rem;
}

input[type="text"]:focus {
outline: 2px solid var(--primary);
border-color: transparent;
}

/ Features /
.features {
padding: 4rem 5%;
background: #1e293b;
margin-top: 4rem;
}

.container {
max-width: 1200px;
margin: 0 auto;
}

.section-title {
text-align: center;
margin-bottom: 3rem;
font-size: 2.5rem;
}

.grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
gap: 2rem;
}

.card {
background: var(--bg);
padding: 2rem;
border-radius: 1rem;
border: 1px solid #334155;
transition: transform 0.3s;
}

.card:hover {
transform: translateY(-5px);
border-color: var(--primary);
}

.card h3 {
margin-bottom: 1rem;
color: var(--primary);
}

/ Preview Modal (Simulation) /
.modal {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.8);
z-index: 1000;
justify-content: center;
align-items: center;
}

.modal-content {
background: var(--card-bg);
width: 90%;
max-width: 1000px;
height: 80vh;
border-radius: 1rem;
overflow: hidden;
display: flex;
flex-direction: column;
}

.modal-header {
padding: 1rem;
background: #0f172a;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid #334155;
}

.iframe-placeholder {
flex: 1;
background: white;
color: black;
display: flex;
justify-content: center;
align-items: center;
font-size: 1.5rem;
position: relative;
}

.loading-spinner {
border: 4px solid #f3f3f3;
border-top: 4px solid var(--primary);
border-radius: 50%;
width: 40px;
height: 40px;
animation: spin 1s linear infinite;
}

@keyframes spin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}

/ Responsive /
@media (max-width: 768px) {
.hero h1 { font-size: 2.5rem; }
.input-group { flex-direction: column; }
nav { display: none; } / Simplified for mobile demo */
}
</style>
</head>
